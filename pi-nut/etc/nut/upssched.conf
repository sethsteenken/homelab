CMDSCRIPT /usr/local/bin/nut-upssched.sh

PIPEFN /var/run/nut/upssched.pipe
LOCKFN /var/run/nut/upssched.lock

# 1. On Battery Early Shutdown
AT ONBATT * START-TIMER early-shutdown 60
AT ONLINE * CANCEL-TIMER early-shutdown

# 2. Low Battery Shutdown
AT LOWBATT * EXECUTE shutdown

# 3. Instant Discord Triggers for State Changes
AT ONLINE  * EXECUTE discord-online
AT ONBATT  * EXECUTE discord-onbatt
AT DISCHRG * EXECUTE discord-onbatt
AT LOWBATT * EXECUTE discord-lowbatt
AT COMMOK  * EXECUTE discord-commok
AT COMMBAD * EXECUTE discord-commbad
AT NOCOMM * EXECUTE discord-nocomm
AT NOPARENT * EXECUTE discord-noparent
AT REPLBATT * EXECUTE discord-replbatt